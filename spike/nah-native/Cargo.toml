# Phase 0 throwaway: nah linked natively. See docs/rust-phase0.md.
[package]
name = "nah-native"
version = "0.0.0"
edition = "2024"
publish = false

[features]
# Needs nah-budget.patch applied to a local clone; see budget-patch.toml.
budget = []

[dependencies]
nah-cli = { git = "https://github.com/manuelschipper/nah", rev = "07fea9d900b4a3c012d0a8ec1bc60c7dab18c8d7" }
nah-proto = { git = "https://github.com/manuelschipper/nah", rev = "07fea9d900b4a3c012d0a8ec1bc60c7dab18c8d7" }
nah-observe = { git = "https://github.com/manuelschipper/nah", rev = "07fea9d900b4a3c012d0a8ec1bc60c7dab18c8d7" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]

[profile.release]
opt-level = 3

[profile.release-lto]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true

[patch.crates-io]
# Patches do not carry over from nah's workspace.
gosyn = { git = "https://github.com/manuelschipper/nah", rev = "07fea9d900b4a3c012d0a8ec1bc60c7dab18c8d7" }
