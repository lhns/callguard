[workspace]
resolver = "3"
members = ["crates/callguard", "crates/callguard-nah", "crates/callguard-cli"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
repository = "https://github.com/lhns/callguard"
publish = false

# Every dependency any phase-1 module needs is pinned here, so porting workers
# never edit a Cargo.toml or Cargo.lock.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# No preserve_order: without it a serde_json Value keeps object keys sorted, as
# Go's map[string]any marshals them, and the judge prompt renders from such values.
serde_json = { version = "1", features = ["raw_value"] }
regex = "1"
sha2 = "0.10"
hex = "0.4"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
getrandom = "0.3"
tempfile = "3"
# nah is publish = false, so a git pin: our fork, which is nah v1.7.0 plus
# decide_with_budget (spike/nah-native/nah-budget.patch). Only callguard-nah depends on it.
nah-cli = { git = "https://github.com/lhns/nah", rev = "c35eb6efa5d41477d18c5b193ed5fa5c07352e4c" }
nah-proto = { git = "https://github.com/lhns/nah", rev = "c35eb6efa5d41477d18c5b193ed5fa5c07352e4c" }
nah-observe = { git = "https://github.com/lhns/nah", rev = "c35eb6efa5d41477d18c5b193ed5fa5c07352e4c" }

[workspace.lints.rust]
unsafe_code = "forbid"

# nah's own `[patch.crates-io]` does not carry over to its dependents.
[patch.crates-io]
gosyn = { git = "https://github.com/lhns/nah", rev = "c35eb6efa5d41477d18c5b193ed5fa5c07352e4c" }
