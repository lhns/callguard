[workspace]
resolver = "3"
members = ["crates/callguard", "crates/callguard-nah", "crates/callguard-cli"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
repository = "https://github.com/lhns/callguard"
publish = false

# Dependencies are pinned once here; the crates take them with `workspace = true`.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# No preserve_order: without it a serde_json Value keeps object keys sorted, as
# the judge prompt renders from such values, and its text is pinned by testdata/judge.
serde_json = { version = "1", features = ["raw_value"] }
regex = "1"
sha2 = "0.10"
hex = "0.4"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "socks-proxy"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
getrandom = "0.3"
tempfile = "3"
# nah is publish = false, so a git pin: our fork, which is nah v1.7.0 plus
# decide_with_budget and num-bigint in place of the LGPL malachite crates.
# Only callguard-nah depends on it.
nah-cli = { git = "https://github.com/lhns/nah", rev = "d9b6963a148912b655c533890ad34a5a5e85bbe3" }
nah-proto = { git = "https://github.com/lhns/nah", rev = "d9b6963a148912b655c533890ad34a5a5e85bbe3" }
nah-observe = { git = "https://github.com/lhns/nah", rev = "d9b6963a148912b655c533890ad34a5a5e85bbe3" }

[workspace.lints.rust]
unsafe_code = "forbid"

# nah's own `[patch.crates-io]` does not carry over to its dependents.
[patch.crates-io]
gosyn = { git = "https://github.com/lhns/nah", rev = "d9b6963a148912b655c533890ad34a5a5e85bbe3" }

# Release binaries (release.yml). Not `panic = "abort"`: the crash design relies
# on unwinding (a panic in the child is a crash the parent turns into a verdict).
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "unwind"
