name: ci

# Branches run through a pull request, so one commit does not run twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rust-toolchain.toml names the version and the components.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --features callguard-cli/test-engines -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      # Release mode: the nah tests need nah's analysis to run at release speed.
      # The five skipped tests walk the file system root, run nah's wall-clock
      # budget to its limit, or replay the rule table and nah's corpus; slow.yml
      # runs them (see nah_child.rs).
      - name: Test
        run: >
          cargo test --release --workspace --features callguard-cli/test-engines
          -- --include-ignored --test-threads=1
          --skip the_five_gap_commands_today
          --skip the_gap_commands_hold_when_wrapped
          --skip a_root_walk_past_the_hard_kill_is_never_an_allow
          --skip rule_table
          --skip corpus_conformance
      - name: Plugin self-test
        run: node adapters/selftest.mjs
      # The fake judge cannot decide the judge bucket, so this only checks that
      # the pipeline runs the whole set.
      - name: Eval with the fake judge
        run: cargo run --release --features callguard-cli/test-engines -p callguard-cli -- eval --backend fake --cases evals/cases.jsonl
