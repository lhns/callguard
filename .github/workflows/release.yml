name: release

# A `v*` tag builds the five binaries, smoke-tests those a runner can execute,
# and attaches archives, checksums and licences to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CALLGUARD_VERSION: ${{ github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, musl: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, musl: true }
          # Built on the arm64 runner; the smoke test needs Rosetta.
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - run: rustup target add ${{ matrix.target }}
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: dist-${{ matrix.target }}
      - name: Build
        run: cargo build --profile dist --locked -p callguard-cli --target ${{ matrix.target }}
      - name: Smoke test
        shell: bash
        run: |
          exe=target/${{ matrix.target }}/dist/callguard
          [ -f "$exe.exe" ] && exe="$exe.exe"
          if [ "${{ matrix.target }}" = x86_64-apple-darwin ] && ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "::warning::no Rosetta on this runner: the x86_64-apple-darwin binary was not run"
          else
            node .github/scripts/smoke.mjs "$exe"
          fi
      - name: Package
        shell: bash
        run: |
          name="callguard-$GITHUB_REF_NAME-${{ matrix.target }}"
          mkdir "$name"
          exe=target/${{ matrix.target }}/dist/callguard
          [ -f "$exe.exe" ] && exe="$exe.exe"
          cp "$exe" LICENSE THIRD-PARTY-NOTICES.md "$name/"
          if [ "${{ runner.os }}" = Windows ]; then
            7z a "$name.zip" "$name" > /dev/null
            echo "ASSET=$name.zip" >> "$GITHUB_ENV"
          else
            tar czf "$name.tar.gz" "$name"
            echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        run: sha256sum callguard-* > SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" assets/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
